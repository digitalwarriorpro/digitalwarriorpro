<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141A21">
<title>Dano's Dents Office</title>
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="office.css">
<script src="vendor/supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">Dano's Dents <span>Office</span></div>
  <nav class="tabs" id="tabs" hidden>
    <button data-view="pipeline" aria-pressed="true">Pipeline</button>
    <button data-view="contacts">Contacts</button>
    <button data-view="tasks">Tasks <span class="badge" id="task-badge" hidden></span></button>
    <button data-view="reports">Reports</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<div class="toolbar" id="toolbar" hidden>
  <input type="search" id="q" placeholder="Search name, phone, address, claim #" autocomplete="off">
  <select id="rep-filter" aria-label="Rep"><option value="">All reps</option></select>
  <span class="live" id="live"></span>
</div>
<main id="main"><p class="empty">Loading…</p></main>
<aside class="drawer" id="drawer" hidden></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/office.js"></script>
</body>
</html>
